server:
  servlet:
    context-path: /routes
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true

spring:
  application:
    name: route-lab
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:routes}?sslmode=${DB_SSLMODE:disable}&currentSchema=${DB_SCHEMA:public}"
    username: ${DB_USER:routes}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.sharedCache.mode: NONE
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
  flyway:
    schemas: ${DB_SCHEMA:public}
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
